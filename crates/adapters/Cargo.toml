[package]
name = "adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
domain = { path = "../domain" }
application = { path = "../application" }
async-trait = "0.1.89"
thiserror = "2.0.18"
uuid = { version = "1.20.0", features = ["v4"] }
tracing = "0.1.44"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
rusqlite = { version = "0.40.1", features = ["bundled"] }
reqwest = { version = "0.13.3", features = ["json", "query"] }
tokio = { version = "1.52.3", features = ["time"] }

[features]
# Enables contract tests that exercise the REAL adapters (network / API key / system libs).
# Off by default so `cargo test` runs fully offline against the in-memory fakes (Principle VI).
real-adapters = []

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt", "rt-multi-thread"] }
