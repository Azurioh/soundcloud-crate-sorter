[package]
name = "adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
domain = { path = "../domain" }
application = { path = "../application" }
async-trait = "0.1.89"
thiserror = "2.0.18"
uuid = { version = "1.20.0", features = ["v4"] }
tracing = "0.1.44"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
rusqlite = { version = "0.40.1", features = ["bundled"] }
reqwest = { version = "0.13.3", features = ["json", "query"] }
tokio = { version = "1.52.3", features = ["time", "process", "fs"] }
# --- Audio analysis (US4). All three are confined to the analyzer/downloader adapters. ---
# Decodes to f32 PCM ourselves so the analyzer's input is a known quantity (research.md R4).
symphonia = { version = "0.6.0", features = ["mp3", "aac", "isomp4", "wav", "flac", "ogg", "vorbis"] }
# Deterministic BPM. `bindgen` because aubio-sys ships no aarch64-darwin bindings; `shared` +
# `pkg-config` link Homebrew's libaubio rather than building a copy. See .cargo/config.toml.
aubio-rs = { version = "0.2.0", features = ["bindgen", "shared", "pkg-config"] }
# Deterministic key. Vendored fork — see vendor/libkeyfinder-sys/README.md (research.md R4).
libkeyfinder-sys = { path = "vendor/libkeyfinder-sys" }

[features]
# Enables contract tests that exercise the REAL adapters (network / API key / system libs).
# Off by default so `cargo test` runs fully offline against the in-memory fakes (Principle VI).
real-adapters = []

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt", "rt-multi-thread"] }
tempfile = "3.27.0"
