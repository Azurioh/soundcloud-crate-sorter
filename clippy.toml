# Strict thresholds. The clean-build gate runs `cargo clippy --all-targets -- -D warnings`
# (see scripts/check.sh / T072), so every clippy warning is a hard error.

# Signatures with many positional params are a smell — group them into a params struct.
too-many-arguments-threshold = 5
# Keep single functions readable.
too-many-lines-threshold = 120
